:root{--t:#004741;--m:#437471;--g:#90A4A3;--o:#E0A255;--c:#EBC89E;--b:#E8DCCE;--l:#C8D1DA;--bd:rgba(0,0,0,.1)}
*{box-sizing:border-box}body{margin:0;font-family:'AbarMid',sans-serif;background:#F6F7F7;color:#1B1F23;line-height:1.7}
header{background:var(--t);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-weight:800}header small{color:var(--c)}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap}
main{max-width:900px;margin:0 auto;padding:14px}
button,input,select,textarea{font:inherit}
button{border:1px solid var(--m);background:#fff;color:var(--t);border-radius:10px;padding:7px 14px;cursor:pointer}
button.p{background:var(--t);color:#fff;border-color:var(--t)}button.on{background:var(--m);color:#fff}
button.d{border-color:#b3261e;color:#b3261e}button:disabled{opacity:.5}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--l);border-radius:10px;background:#fff;margin:4px 0 10px}
textarea{min-height:110px}label{font-size:.85rem;color:var(--m);font-weight:700}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>.f{flex:1;min-width:0}
.item{display:flex;justify-content:space-between;gap:8px;padding:9px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.tag{font-size:.75rem;background:var(--b);padding:1px 8px;border-radius:99px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--t);color:#fff;padding:9px 18px;border-radius:99px;display:none;z-index:9}
#login{max-width:360px;margin:12vh auto;padding:0 16px}img.pv{height:70px;border-radius:8px}h3{color:var(--t);margin:.2rem 0 .8rem}
</style>

body{
  background:
    linear-gradient(rgba(255,253,249,.88),rgba(255,253,249,.88)),
    repeating-linear-gradient(45deg,transparent 0 34px,rgba(180,154,121,.045) 34px 35px),
    repeating-linear-gradient(-45deg,transparent 0 34px,rgba(7,63,61,.035) 34px 35px),
    var(--wasl-cream);
  color:var(--wasl-ink);
}
body:before{
  content:"";display:block;height:7px;background:linear-gradient(90deg,transparent 0 7%,var(--wasl-gold-soft) 7% 7.2%,transparent 7.2% 92.8%,var(--wasl-gold-soft) 92.8% 93%,transparent 93%);
  opacity:.75;
}
header{
  position:relative;background:var(--wasl-teal);padding:18px 24px;
  box-shadow:0 8px 28px rgba(7,63,61,.16);border-bottom:1px solid rgba(217,200,174,.5);
}
header:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;background-image:linear-gradient(45deg,transparent 46%,#fff 47%,#fff 49%,transparent 50%),linear-gradient(-45deg,transparent 46%,#fff 47%,#fff 49%,transparent 50%);background-size:56px 56px;}
header>div,header>button{position:relative;z-index:1}
header b{font-size:1.12rem;letter-spacing:.2px;color:#fff}
header small{color:#dfcfb5}
header button{border-color:rgba(255,255,255,.32);background:transparent;color:#fff;border-radius:4px;padding:7px 16px}
header button:hover{background:rgba(255,255,255,.10)}
nav{
  background:rgba(255,253,249,.96);border-bottom:1px solid var(--wasl-line);padding:12px 16px;gap:8px;
  box-shadow:0 3px 16px rgba(67,55,39,.05);scrollbar-width:thin;
}
nav button{border:1px solid var(--wasl-line);background:var(--wasl-paper);color:var(--wasl-teal);border-radius:3px;padding:8px 18px;font-weight:800;transition:.18s}
nav button:hover{border-color:var(--wasl-gold);background:#faf5ec}
nav button.on{background:var(--wasl-teal);border-color:var(--wasl-teal);color:#fff;box-shadow:inset 0 -3px 0 var(--wasl-gold)}
main{max-width:1080px;padding:22px 18px 50px}
.card{
  background:rgba(255,253,249,.97);border:1px solid var(--wasl-line);border-radius:14px;padding:18px;margin-bottom:15px;
  box-shadow:0 8px 24px rgba(70,58,42,.06);position:relative;overflow:hidden;
}
.card:before{content:"";position:absolute;top:0;right:0;width:74px;height:3px;background:var(--wasl-gold)}
h3{color:var(--wasl-teal);font-size:1.08rem;font-weight:800}
label{color:#7d6a52;font-weight:800}
input,select,textarea{border:1px solid #d7cec0;background:#fffefa;color:var(--wasl-ink);border-radius:8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--wasl-gold);box-shadow:0 0 0 3px rgba(180,154,121,.12)}
button{border-color:var(--wasl-gold);color:var(--wasl-teal);background:#fffdf8;border-radius:7px}
button.p{background:var(--wasl-teal);border-color:var(--wasl-teal);color:#fff}
button.p:hover{background:var(--wasl-teal-2)}
button.on{background:var(--wasl-teal);border-color:var(--wasl-teal);color:#fff}
button.d{border-color:#a14b43;color:#963f37;background:#fff9f7}
.item{padding:12px 8px;border-bottom:1px solid #e4dbcf}
.item:hover{background:#fbf6ed}
.tag{background:#eee5d7;color:#7a684f;border:1px solid #ddcfba}
#login{max-width:430px;margin:9vh auto;padding:0 18px}
#login .card{padding:28px 24px}
#login .card:after{content:"";display:block;height:1px;background:linear-gradient(90deg,transparent,var(--wasl-gold),transparent);margin:22px 0 0}
#login h3{text-align:center;font-size:1.3rem;margin-bottom:20px}
#toast{background:var(--wasl-teal);border:1px solid var(--wasl-gold);box-shadow:0 10px 30px rgba(7,63,61,.22)}
img.pv{border-radius:6px;border:1px solid var(--wasl-line);object-fit:cover}
@media(max-width:640px){
 body:before{height:4px}
 header{padding:14px 14px}
 header b{font-size:.98rem}
 nav{padding:9px 10px;gap:6px}
 nav button{padding:7px 12px;font-size:.78rem}
 main{padding:14px 10px 36px}
 .card{padding:14px;margin-bottom:11px}
 .row>.f{min-width:100%}
 #login{margin:7vh auto;padding:0 12px}
}
</style>

</head><body>
<div id="login"><div class="card"><h3>تسجيل دخول الإدارة</h3>
<label>البريد الإلكتروني</label><input id="em" type="email" dir="ltr">
<label>كلمة المرور</label><input id="pw" type="password" dir="ltr">
<div id="lerr" style="display:none;background:#fdecea;color:#b3261e;border-radius:8px;padding:9px 11px;margin:10px 0;font-size:.85rem;line-height:1.7"></div>
<button class="p" id="go" style="width:100%">دخول</button></div></div>
<div id="app" style="display:none">
<header><div><b>لوحة إدارة المنصة</b><br><small id="who"></small></div><button id="out">خروج</button></header>
<nav id="nav"></nav><main id="view"></main></div>
<div id="toast"></div>
<script>
const SUPABASE_URL='https://rvzipxbfkvnzpazoozur.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2emlweGJma3ZuenBhem9venVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTk5NDMsImV4cCI6MjEwNjc3NTk0M30.0DP9cDH4YGDAQolaRfFLWryz58CvPslxYQJ2ZUS-rks';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=i=>document.getElementById(i), V=()=>$('view');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null,canEdit=false,kind='nizam_articles',tab='art';
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}
async function chk(p){const r=await p;if(r.error){toast('تعذّر التنفيذ: '+r.error.message);throw r.error}return r.data}
function loginMsg(m){const e=$('lerr');if(e){e.textContent=m||'';e.style.display=m?'block':'none'}}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('login').style.display='block';$('app').style.display='none';return}
  const {data:p,error:pe}=await sb.from('profiles').select('*').eq('user_id',session.user.id).maybeSingle();
  if(pe){console.error('profiles error',pe);await sb.auth.signOut();$('login').style.display='block';$('app').style.display='none';loginMsg('تعذّرت قراءة جدول profiles: '+pe.message+' (غالبًا سياسة RLS تمنع القراءة)');return}
  if(!p){await sb.auth.signOut();$('login').style.display='block';$('app').style.display='none';loginMsg('تم تسجيل الدخول، لكن لا يوجد سجل لهذا الحساب في جدول profiles (user_id = '+session.user.id+')');return}
  if(!p.is_active){await sb.auth.signOut();$('login').style.display='block';$('app').style.display='none';loginMsg('الحساب موجود لكنه غير مفعّل (is_active = false)');return}
  loginMsg('');
  me=p;canEdit=['super_admin','editor'].includes(p.role);
  $('who').textContent=(p.full_name||session.user.email)+' — '+({super_admin:'مدير عام',editor:'محرر',viewer:'مراجع'}[p.role]||p.role);
  $('login').style.display='none';$('app').style.display='block';go(tab)}
$('go').onclick=async()=>{
  loginMsg('');const b=$('go');b.disabled=true;
  try{
    const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
    if(error){console.error('signIn error',error);
      const m=(error.message||'').toLowerCase();
      loginMsg(m.includes('invalid login')?'البريد أو كلمة المرور غير صحيحة':m.includes('confirm')?'البريد الإلكتروني غير مؤكَّد في Supabase (Authentication ← Users)':m.includes('api key')?'مفتاح Supabase (anon key) غير صالح لهذا المشروع':'تعذّر تسجيل الدخول: '+error.message);return}
    await boot();
  }catch(e){console.error(e);loginMsg('تعذّر الاتصال بـ Supabase: '+(e.message||e))}
  finally{b.disabled=false}};
$('out').onclick=async()=>{await sb.auth.signOut();boot()};
const TABS=[['art','المواد'],['link','الربط والترتيب'],['set','الإعدادات والملف'],['ban','البنرات'],['log','سجل التعديلات']];
function go(t){tab=t;$('nav').innerHTML=TABS.map(([k,n])=>`<button class="${k==t?'on':''}" onclick="go('${k}')">${n}</button>`).join('');({art:vArt,link:vLink,set:vSet,ban:vBan,log:vLog})[t]()}
const ro=()=>canEdit?'':'<p class="tag">وضع العرض فقط</p>';

async function vArt(sel){
  const rows=await chk(sb.from(kind).select('*').order('sort_order').order('id'));
  const a=sel==null?null:(rows.find(r=>r.id==sel)||{});
  V().innerHTML=`${ro()}<div class="row" style="margin-bottom:10px">
  <button class="${kind=='nizam_articles'?'on':''}" onclick="kind='nizam_articles';vArt()">مواد النظام</button>
  <button class="${kind!='nizam_articles'?'on':''}" onclick="kind='regulation_articles';vArt()">مواد اللائحة</button>
  ${canEdit?'<button class="p" onclick="vArt(0)">+ مادة جديدة</button>':''}</div>
  ${a?`<div class="card"><h3>${a.id?'تعديل مادة':'مادة جديدة'}</h3>
  <div class="row"><div style="width:90px"><label>الرقم</label><input id="a_num" value="${esc(a.num)}"></div>
  <div class="f"><label>العنوان</label><input id="a_title" value="${esc(a.title)}"></div>
  <div style="width:90px"><label>الترتيب</label><input id="a_so" type="number" value="${a.sort_order??rows.length+1}"></div></div>
  <label>العنوان الفرعي</label><input id="a_sub" value="${esc(a.subtitle)}">
  <label>النص</label><textarea id="a_body" style="min-height:220px">${esc(a.body)}</textarea>
  <label><input id="a_pub" type="checkbox" style="width:auto" ${a.is_published!==false?'checked':''}> منشورة</label><br>
  ${canEdit?`<button class="p" onclick="saveArt(${a.id||0})">حفظ</button> `:''}
  ${canEdit&&a.id?`<button class="d" onclick="delArt(${a.id})">حذف</button> `:''}<button onclick="vArt()">إغلاق</button></div>`:''}
  <div class="card">${rows.map(r=>`<div class="item" onclick="vArt(${r.id})"><span>${esc(r.title)} ${r.subtitle?'— '+esc(r.subtitle):''}</span>${r.is_published?'':'<span class="tag">مخفية</span>'}</div>`).join('')||'لا توجد مواد'}</div>`}
async function saveArt(id){
  const o={num:$('a_num').value,title:$('a_title').value.trim(),subtitle:$('a_sub').value,body:$('a_body').value,sort_order:+$('a_so').value||0,is_published:$('a_pub').checked};
  if(!o.title)return toast('أدخل العنوان');
  await chk(id?sb.from(kind).update(o).eq('id',id):sb.from(kind).insert(o));toast('تم الحفظ');vArt()}
async function delArt(id){if(!confirm('حذف المادة نهائيًا؟'))return;await chk(sb.from(kind).delete().eq('id',id));toast('تم الحذف');vArt()}

async function vLink(nid){
  const N=await chk(sb.from('nizam_articles').select('id,title,subtitle').order('sort_order').order('id'));
  const R=await chk(sb.from('regulation_articles').select('id,title,subtitle').order('sort_order').order('id'));
  nid=nid||N[0]?.id;const L=nid?await chk(sb.from('article_links').select('*').eq('nizam_id',nid).order('sort_order')):[];
  const nm=id=>{const r=R.find(x=>x.id==id);return r?r.title+(r.subtitle?' — '+r.subtitle:''):id};
  window._L=L;window._nid=nid;
  V().innerHTML=`${ro()}<div class="card"><label>مادة النظام</label>
  <select onchange="vLink(+this.value)">${N.map(n=>`<option value="${n.id}" ${n.id==nid?'selected':''}>${esc(n.title)} ${esc(n.subtitle)}</option>`).join('')}</select>
  <label>مواد اللائحة المقابلة (بالترتيب)</label>
  ${L.map((l,i)=>`<div class="item" style="cursor:default"><span>${i+1}. ${esc(nm(l.regulation_id))}</span>${canEdit?`<span class="row"><button onclick="mv(${i},-1)">▲</button><button onclick="mv(${i},1)">▼</button><button class="d" onclick="rmL(${l.id})">إزالة</button></span>`:''}</div>`).join('')||'<p>لا يوجد مقابل في اللائحة</p>'}
  ${canEdit?`<div class="row" style="margin-top:12px"><select id="addR" class="f">${R.filter(r=>!L.some(l=>l.regulation_id==r.id)).map(r=>`<option value="${r.id}">${esc(r.title)} ${esc(r.subtitle)}</option>`).join('')}</select><button class="p" onclick="addL()">إضافة</button></div>`:''}</div>`}
async function addL(){const v=+$('addR').value;if(!v)return;const m=Math.max(0,..._L.map(l=>l.sort_order))+1;await chk(sb.from('article_links').insert({nizam_id:_nid,regulation_id:v,sort_order:m}));vLink(_nid)}
async function rmL(id){await chk(sb.from('article_links').delete().eq('id',id));vLink(_nid)}
async function mv(i,d){const a=_L[i],b=_L[i+d];if(!b)return;
  await chk(sb.from('article_links').update({sort_order:b.sort_order}).eq('id',a.id));
  await chk(sb.from('article_links').update({sort_order:a.sort_order===b.sort_order?a.sort_order+d:a.sort_order}).eq('id',b.id));vLink(_nid)}

async function vSet(){
  const s=await chk(sb.from('site_settings').select('*').eq('id',1).single());
  const ls=x=>(x||[]).join('\n');
  V().innerHTML=`${ro()}<div class="card"><h3>رابط اللائحة التنفيذية</h3>
  <label>نص الزر</label><input id="s_lab" value="${esc(s.regulation_url_label)}">
  <label>الرابط (اتركه فارغًا لإخفاء الخانة)</label><input id="s_url" dir="ltr" value="${esc(s.regulation_url)}"></div>
  <div class="card"><h3>التذييل</h3><label>النص</label><input id="s_ft" value="${esc(s.footer_text)}">
  <label>الروابط — سطر لكل رابط بصيغة: النص | الرابط</label>
  <textarea id="s_fl" dir="auto">${esc((s.footer_links||[]).map(l=>l.label+' | '+l.url).join('\n'))}</textarea></div>
  <div class="card"><h3>الفريق</h3><label>فريق الإعداد (اسم في كل سطر)</label><textarea id="s_tm">${esc(ls(s.team_names))}</textarea>
  <label>الإشراف (اسم في كل سطر)</label><textarea id="s_sv">${esc(ls(s.supervisors))}</textarea></div>
  ${canEdit?'<button class="p" onclick="saveSet()">حفظ الإعدادات</button>':''}
  <div class="card" style="margin-top:14px"><h3>ملف النظام كاملًا (PDF)</h3>
  <p>${s.pdf_path?'الملف الحالي: <a href="'+sb.storage.from('documents').getPublicUrl(s.pdf_path).data.publicUrl+'" target="_blank">عرض</a>':'لا يوجد ملف مرفوع'}</p>
  ${canEdit?'<input id="pdf" type="file" accept="application/pdf"><button class="p" onclick="upPdf()">رفع / استبدال</button>':''}</div>`}
async function saveSet(){
  const L=x=>x.split('\n').map(t=>t.trim()).filter(Boolean);
  const links=L($('s_fl').value).map(t=>{const i=t.lastIndexOf('|');return{label:t.slice(0,i).trim(),url:t.slice(i+1).trim()}}).filter(l=>l.label&&l.url);
  await chk(sb.from('site_settings').update({regulation_url_label:$('s_lab').value.trim()||'اللائحة التنفيذية',regulation_url:$('s_url').value.trim()||null,footer_text:$('s_ft').value,footer_links:links,team_names:L($('s_tm').value),supervisors:L($('s_sv').value)}).eq('id',1));toast('تم الحفظ')}
async function upPdf(){const f=$('pdf').files[0];if(!f)return toast('اختر ملف PDF');
  await chk(sb.storage.from('documents').upload('system.pdf',f,{upsert:true,contentType:'application/pdf',cacheControl:'60'}));
  await chk(sb.from('site_settings').update({pdf_path:'system.pdf'}).eq('id',1));toast('تم رفع الملف');vSet()}

async function vBan(){
  const B=await chk(sb.from('banners').select('*').order('sort_order').order('id'));
  const url=p=>sb.storage.from('banners').getPublicUrl(p).data.publicUrl;
  V().innerHTML=`${ro()}${canEdit?`<div class="card"><h3>بنر جديد</h3>
  <input id="b_f" type="file" accept="image/*"><label>وصف الصورة</label><input id="b_alt">
  <label>رابط عند النقر (اختياري)</label><input id="b_l" dir="ltr">
  <div class="row"><div class="f"><label>يبدأ</label><input id="b_s" type="datetime-local"></div><div class="f"><label>ينتهي</label><input id="b_e" type="datetime-local"></div></div>
  <button class="p" onclick="addBan()">رفع البنر</button></div>`:''}
  <div class="card">${B.map(b=>`<div class="item" style="cursor:default"><span class="row"><img class="pv" src="${url(b.image_path)}" alt=""><span>${esc(b.alt_text)||'بنر'}</span></span>
  ${canEdit?`<span class="row"><button onclick="togBan(${b.id},${!b.is_active})">${b.is_active?'إيقاف':'تفعيل'}</button><button class="d" onclick="delBan(${b.id},'${esc(b.image_path)}')">حذف</button></span>`:`<span class="tag">${b.is_active?'فعّال':'موقوف'}</span>`}</div>`).join('')||'لا توجد بنرات — لن يظهر شريط البنرات في الموقع'}</div>`}
async function addBan(){const f=$('b_f').files[0];if(!f)return toast('اختر صورة');
  const p=Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');
  await chk(sb.storage.from('banners').upload(p,f,{contentType:f.type}));
  const d=i=>$(i).value?new Date($(i).value).toISOString():null;
  await chk(sb.from('banners').insert({image_path:p,alt_text:$('b_alt').value,link_url:$('b_l').value.trim()||null,starts_at:d('b_s'),ends_at:d('b_e')}));toast('تمت الإضافة');vBan()}
async function togBan(id,v){await chk(sb.from('banners').update({is_active:v}).eq('id',id));vBan()}
async function delBan(id,p){if(!confirm('حذف البنر؟'))return;await chk(sb.from('banners').delete().eq('id',id));await sb.storage.from('banners').remove([p]);vBan()}

async function vLog(){
  const D=await chk(sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(60));
  const N={nizam_articles:'مواد النظام',regulation_articles:'مواد اللائحة',article_links:'الربط',site_settings:'الإعدادات',banners:'البنرات',profiles:'المستخدمون'},A={INSERT:'إضافة',UPDATE:'تعديل',DELETE:'حذف'};
  V().innerHTML=`<div class="card">${D.map(d=>`<div class="item" style="cursor:default"><span>${A[d.action]} — ${N[d.table_name]||d.table_name} #${esc(d.record_id)}</span><small dir="ltr">${new Date(d.created_at).toLocaleString('ar-SA')}</small></div>`).join('')||'لا توجد سجلات'}</div>`}
boot();
</script></body></html>
